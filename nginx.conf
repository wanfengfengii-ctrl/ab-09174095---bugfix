server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 健康检查端点（Docker HEALTHCHECK 与 compose healthcheck 共用）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # 静态资源（JS/CSS 模块）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
